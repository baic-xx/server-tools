services:
  mongodb:
    image: mongo:7
    container_name: monitor-mongodb
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    # 不暴露端口到外部，仅 Docker 内部网络通信
    # 如需本地调试可取消注释:
    ports:
      - "127.0.0.1:${MONGODB_PORT:-27017}:27017"
    environment:
      - TZ=Asia/Shanghai
      - MONGO_INITDB_DATABASE=server_monitor

  server:
    build: ./server
    container_name: monitor-server
    ports:
      - "${BACKEND_PORT:-30252}:${BACKEND_PORT:-30252}"
    depends_on:
      - mongodb
    environment:
      - TZ=Asia/Shanghai
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB=server_monitor
      - SERVER_PORT=${BACKEND_PORT:-30252}
    restart: unless-stopped
    volumes:
      - ./server/static:/app/static:ro

volumes:
  mongo_data:
